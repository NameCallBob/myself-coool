name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 對齊本地 npm 11 產生的 lockfile(Node 22 內建 npm 10 會解析失敗)
          node-version: 24
          cache: npm
      - run: npm ci

      # 工具邏輯的單元測試。跑在 node --test 上,沒有額外依賴。
      - run: npm test

      - run: npm run build

      # /tools 這一頁對讀者的承諾是「載入之後不發出任何網路請求」,
      # 而那句話只有在這裡被強制執行才算數:verify 會載入每一個頁面、
      # 斷言零跨來源請求、零 CSP 違規、離線可用。沒過就不會部署。
      - run: npx playwright install --with-deps chromium
      - run: npm run verify -- --all

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
