>private row inserted</p></span></div></foreignObject></g></g><g class="edgeLabel" transform="translate(116, 381)"><g class="label" data-id="edge1" transform="translate(-100, -36)"><foreignObject width="200" height="72"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="edgeLabel"><p>first login attempt<br />add() writes status '0' and count 0</p></span></div></foreignObject></g></g><g class="edgeLabel" transform="translate(152.5, 628)"><g class="label" data-id="edge2" transform="translate(-100, -60)"><foreignObject width="200" height="120"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="edgeLabel"><p>next login while count == 5<br />checklock() writes status '1' and count 0<br />API answers 400 account be locked</p></span></div></foreignObject></g></g><g class="edgeLabel" transform="translate(355.02500000037253, 881.8)"><g class="label" data-id="edge3" transform="translate(-100, -60)"><foreignObject width="200" height="120"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="edgeLabel"><p>any POST /login<br />checklock() returns true before<br />the password is ever checked</p></span></div></foreignObject></g></g><g class="edgeLabel" transform="translate(372.5, 628)"><g class="label" data-id="edge4" transform="translate(-100, -72)"><foreignObject width="200" height="144"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="edgeLabel"><p>POST /forgotpassword with both<br />correct member.safe_ans1 and safe_ans2<br />emptyRecord() plus a Str random 12 char password</p></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="Locked-Locked----note-5" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="Unlocked----note-6-Unlocked" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="node  statediagram-state" id="my-svg-state-NoRow-1" data-look="classic" transform="translate(116, 208)"><rect class="basic label-container" style="" rx="5" ry="5" x="-108" y="-56" width="216" height="112"/><g class="label" style="" transform="translate(-100, -48)"><rect/><foreignObject width="200" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel markdown-node-label"><p>No locks row yet - checklock() firstOrFail throws and LockController add() creates one</p></span></div></foreignObject></g></g><g class="node  statediagram-state" id="my-svg-state-Unlocked-6" data-look="classic" transform="translate(355.02500000037253, 486.5)"><g><rect class="outer title-state" style="" x="-223.921875" y="-44.5" width="447.84375" height="89"/><line class="divider" x1="-223.921875" x2="223.921875" y1="-16.5" y2="-16.5"/></g><g class="label" style="" transform="translate(-219.921875, -41.5)"><foreignObject width="349.609375" height="24" transform="translate( 45.1171875, 0)"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>Unlocked - locks.status = '0', locks.count = 0 to 5</p></span></div></foreignObject><foreignObject width="439.84375" height="48" transform="translate( 0, 33)"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5;"><span class="nodeLabel"><p>on a failed attempt() - incrementCount() does count += 1<br />on a successful login - emptyRecord() resets status and count</p></span></div></foreignObject></g></g><g class="node  statediagram-state" id="my-svg-state-Locked-5" data-look="classic" transform="translate(355.02500000037253, 757)"><rect class="basic label-container" style="" rx="5" ry="5" x="-108" y="-32" width="216" height="64"/><g class="label" style="" transform="translate(-100, -24)"><rect/><foreignObject width="200" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel markdown-node-label"><p>Locked - locks.status = '1', locks.count reset to 0</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-state-root_start-0" data-look="classic" transform="translate(116, 15)"><circle class="state-start" r="7" width="14" height="14"/></g><g class="node statediagram-note" id="my-svg-state-Locked----note-5" data-look="classic" transform="translate(169.97499999962747, 951)"><g class="basic label-container outer-path"><path d="M-115 -87 L115 -87 L115 87 L-115 87" stroke="none" stroke-width="0" fill="#fff5ad" style=""/><path d="M-115 -87 C-62.16948658958524 -87, -9.33897317917048 -87, 115 -87 M-115 -87 C-23.11484045052302 -87, 68.77031909895396 -87, 115 -87 M115 -87 C115 -49.70911866379249, 115 -12.418237327584976, 115 87 M115 -87 C115 -27.24294669190104, 115 32.51410661619792, 115 87 M115 87 C42.62733667748513 87, -29.745326645029735 87, -115 87 M115 87 C41.48302638850582 87, -32.03394722298836 87, -115 87 M-115 87 C-115 33.8202789639809, -115 -19.359442072038206, -115 -87 M-115 87 C-115 45.759015179544875, -115 4.5180303590897495, -115 -87" stroke="#aaaa33" stroke-width="1.3" fill="none" stroke-dasharray="0 0" style=""/></g><g class="label noteLabel" style="" transform="translate(-100, -72)"><rect/><foreignObject width="200" height="144"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel markdown-node-label"><p>The security-question reset is the only exit<br />from Locked in this codebase - there is no<br />admin unlock, no TTL and no scheduled job.</p></span></div></foreignObject></g></g><g class="node statediagram-note" id="my-svg-state-Unlocked----note-6" data-look="classic" transform="translate(409, 208)"><g class="basic label-container outer-path"><path d="M-115 -87 L115 -87 L115 87 L-115 87" stroke="none" stroke-width="0" fill="#fff5ad" style=""/><path d="M-115 -87 C-41.594965799634736 -87, 31.81006840073053 -87, 115 -87 M-115 -87 C-27.607167451369648 -87, 59.785665097260704 -87, 115 -87 M115 -87 C115 -23.25054951555869, 115 40.49890096888262, 115 87 M115 -87 C115 -34.81233891257418, 115 17.375322174851647, 115 87 M115 87 C50.286428786598336 87, -14.427142426803329 87, -115 87 M115 87 C45.68742406481479 87, -23.625151870370416 87, -115 87 M-115 87 C-115 50.013177762095424, -115 13.026355524190848, -115 -87 M-115 87 C-115 27.983272579739136, -115 -31.033454840521728, -115 -87" stroke="#aaaa33" stroke-width="1.3" fill="none" stroke-dasharray="0 0" style=""/></g><g class="label noteLabel" style="" transform="translate(-100, -72)"><rect/><foreignObject width="200" height="144"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel markdown-node-label"><p>The lock trips on the 6th attempt - checklock()<br />runs before attempt(), so count must already<br />equal 5 for the account to flip to Locked.</p></span></div></foreignObject></g></g><g class="label edgeLabel" id="Locked---Locked---1" transform="translate(355.02500000037253, 951)"><rect width="0.1" height="0.1"/><g class="label" style="" transform="translate(0, 0)"><rect/><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 10px; text-align: center;"><span class="nodeLabel"></span></div></foreignObject></g></g><g class="label edgeLabel" id="Locked---Locked---2" transform="translate(355.02500000037253, 1233.050000000745)"><rect width="0.1" height="0.1"/><g class="label" style="" transform="translate(0, 0)"><rect/><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 10px; text-align: center;"><span class="nodeLabel"></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><text text-anchor="middle" x="293.47344970703125" y="-25" class="statediagramTitleText">FoodSelector backend - account lock lifecycle (locks table)</text></svg>